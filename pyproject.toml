[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "restock"
version = "0.1.0"
description = "Inventory event and replenishment service (take-home prototype)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[project.scripts]
restock = "restock.main:cli"

[tool.setuptools]
packages = ["restock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Starlette 1.10 nudges TestClient users towards the httpx2 package; I stay on pinned httpx
# because the outbound worker uses it too.
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The supplied assessment files are a contract: never lint-fix or reformat them.
extend-exclude = ["fixtures", "tools", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The repo's alembic/ migrations directory would otherwise make the package look first-party.
known-third-party = ["alembic"]
